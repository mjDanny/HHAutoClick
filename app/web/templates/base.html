<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal HH Job Autopilot</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17212b;
        background: #f6f7f9;
      }
      header {
        background: #ffffff;
        border-bottom: 1px solid #dfe3e8;
        padding: 16px 24px;
      }
      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 24px;
      }
      nav a {
        margin-right: 16px;
        color: #0b66c3;
        text-decoration: none;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #ffffff;
      }
      th, td {
        border-bottom: 1px solid #e5e9ef;
        padding: 10px;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: #f0f3f7;
      }
      .muted {
        color: #667085;
      }
      .score {
        font-weight: 700;
      }
      .panel {
        background: #ffffff;
        border: 1px solid #dfe3e8;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
      }
      input {
        padding: 8px;
        margin-right: 8px;
      }
      button, .button {
        display: inline-block;
        padding: 8px 10px;
        color: #ffffff;
        background: #0b66c3;
        border: 0;
        border-radius: 6px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="/">Dashboard</a>
        <a href="/vacancies">Vacancies</a>
        <a href="/docs">API docs</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
